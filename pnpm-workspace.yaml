# pnpm's settings for this app (it is one package, not a workspace).

# Refuse to install on a Node outside package.json "engines".
engineStrict: true

# Without this, pnpm only records optional-dependency variants (Next's compiler, for one) for the host platform that ran `pnpm install`,
# so a lockfile made on a Mac has nothing for the Alpine image to install. Covers the contributors' Macs, CI, and node:24-alpine on
# arm64 and x64.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl
