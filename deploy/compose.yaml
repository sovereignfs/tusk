# Tusk with an sqld database: the default setup (DESIGN.md §23).
#
#   cp .env.example .env     # then edit it: at least TUSK_URL, TUSK_AUTH_SECRET and TUSK_ENCRYPTION_KEY
#   docker compose up -d --build
#
# Other setups: `-f compose.file.yaml` is one container with a database file (the smallest), and
# `-f compose.yaml -f compose.postgres.yaml` replaces sqld with PostgreSQL. README.md has the rest.
name: tusk

services:
  web:
    build:
      context: ..
      # The port is written in sovereign.manifest.json, which Compose cannot read; a test holds this to it.
      args:
        PORT: '3000'
    image: ${TUSK_IMAGE:-tusk}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TUSK_DB_DIALECT: sqld
      TUSK_SQLD_URL: http://sqld:8080
      TUSK_SQLD_ADMIN_URL: http://sqld:8081
    depends_on:
      sqld:
        condition: service_healthy
    # Only the machine itself can reach this port: a reverse proxy with TLS in front of it is how people do.
    ports:
      - '127.0.0.1:${TUSK_PORT:-3000}:3000'

  sqld:
    # Pinned, not `latest`. 0.24.33 or later: earlier releases cannot create a namespace the way the app does.
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    restart: unless-stopped
    command: ['/bin/sqld', '--enable-namespaces']
    environment:
      SQLD_NODE: primary
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:8081
    volumes:
      - sqld-data:/var/lib/sqld
    # sqld has no sign-in of its own, so it is not published: the app reaches it on this network and nothing else does.
    healthcheck:
      # The image has bash and no curl.
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sqld-data:
