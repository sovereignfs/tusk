# The smallest setup: one container, and the database is a file on a volume (DESIGN.md §23).
#
#   cp .env.example .env     # then edit it: at least TASKS_URL, TASKS_AUTH_SECRET and TASKS_ENCRYPTION_KEY
#   docker compose -f compose.file.yaml up -d --build
#
# One process, so there is nothing to wait for and nothing else to run. It suits one person or a small group; a second instance cannot
# share the file, so this setup does not scale out. The file must stay on a local disk, never a network filesystem.
name: tasks

services:
  web:
    build:
      context: ..
      # The port is written in sovereign.manifest.json, which Compose cannot read; a test holds this to it.
      args:
        PORT: '3000'
    image: ${TASKS_IMAGE:-tasks}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TASKS_DB_DIALECT: sqlite
      TASKS_SQLITE_URL: file:/data/tasks.db
    volumes:
      - tasks-data:/data
    ports:
      - '127.0.0.1:${TASKS_PORT:-3000}:3000'

volumes:
  tasks-data:
